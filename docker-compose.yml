# =============================================================================
# landing-au — docker-compose.yml (Alternativa A: Puerto Localhost)
# =============================================================================
# Objetivo: Docker Compose para VPS con Nginx externo.
# El contenedor expone SOLO en localhost:3000, no accesible desde internet.
# Nginx (instalado en el host) hace proxy_pass a http://127.0.0.1:3000
# =============================================================================

services:
  landing:
    image: tu-usuario-dockerhub/landing-au:latest
    container_name: landing-au
    restart: unless-stopped
    
    # SOLO exponer en localhost. Nginx en el host hará proxy.
    # Esto significa que el puerto 3000 NO es accesible desde fuera del VPS.
    ports:
      - "127.0.0.1:3000:3000"
    
    # Variables de entorno de runtime
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      # Formulario de contacto (SMTP) — runtime; definir en el .env del servidor.
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - BOOKING_EMAIL_TO=${BOOKING_EMAIL_TO}
      - BOOKING_EMAIL_FROM=${BOOKING_EMAIL_FROM}
      # La analítica (NEXT_PUBLIC_GA_MEASUREMENT_ID / NEXT_PUBLIC_CF_ANALYTICS_TOKEN)
      # es de BUILD: se pasa como build-arg en el GitHub Action, no aquí.
    
    # Healthcheck — verifica que la aplicación responde correctamente
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    
    # Logging controlado
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Opcional: Redis local (solo si se necesita cache de sesiones o rate limiting)
  # PostgreSQL NO corre en este VPS — es una conexión remota externa.
